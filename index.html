<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Jufelix ERP v7.0 Professional Business Management System"
    >

    <meta
        name="theme-color"
        content="#0b5ed7"
    >

    <title>
        Jufelix ERP v7.0 Professional
    </title>


    <!-- =====================================
         PWA
    ====================================== -->

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="apple-touch-icon"
        href="assets/icons/icon-192.png"
    >


    <!-- =====================================
         GLOBAL STYLES
    ====================================== -->

    <link
        rel="stylesheet"
        href="assets/css/variables.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/base.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/components.css"
    >


    <style>

        .install-app-button {

            width: 100%;

            margin-top: 14px;

            min-height: 52px;

            padding: 12px 18px;

            border: 2px solid #6f42c1;

            border-radius: 10px;

            background: #ffffff;

            color: #6f42c1;

            font-size: 16px;

            font-weight: 800;

            cursor: pointer;

            align-items: center;

            justify-content: center;

            gap: 8px;

            display: none;
        }


        .install-app-button:active {

            transform:
                scale(.99);
        }

    </style>

</head>


<body>


    <main class="startup-page">


        <section class="startup-card">


            <div
                class="brand-logo"
                aria-label="Jufelix ERP logo"
            >
                J
            </div>


            <p class="version-label">
                VERSION 7.0 PROFESSIONAL
            </p>


            <h1>
                Jufelix ERP
            </h1>


            <p class="startup-description">

                Professional business management
                for inventory, sales, purchases,
                branches, expenses and reports.

            </p>


            <div
                class="startup-status"
                id="startupStatus"
            >

                <span class="status-spinner"></span>

                <span id="startupMessage">
                    Starting application...
                </span>

            </div>


            <div
                class="system-checks"
                id="systemChecks"
            >


                <div
                    class="system-check"
                    id="htmlCheck"
                >

                    <span class="check-icon">
                        ○
                    </span>

                    <span>
                        Application interface
                    </span>

                </div>


                <div
                    class="system-check"
                    id="storageCheck"
                >

                    <span class="check-icon">
                        ○
                    </span>

                    <span>
                        Local storage service
                    </span>

                </div>


                <div
                    class="system-check"
                    id="configCheck"
                >

                    <span class="check-icon">
                        ○
                    </span>

                    <span>
                        Application configuration
                    </span>

                </div>


                <div
                    class="system-check"
                    id="databaseCheck"
                >

                    <span class="check-icon">
                        ○
                    </span>

                    <span>
                        Database architecture
                    </span>

                </div>


            </div>


            <button
                type="button"
                class="primary-button hidden"
                id="continueButton"
            >
                Continue to Jufelix ERP
            </button>


            <button
                type="button"
                id="installAppButton"
                class="install-app-button"
            >
                📲 Install Jufelix ERP
            </button>


            <div
                class="startup-error hidden"
                id="startupError"
            ></div>


            <p class="startup-footer">

                ©
                <span id="currentYear"></span>
                Jufelix Services

            </p>


        </section>


    </main>



    <!-- =====================================
         CONFIGURATION
    ====================================== -->

    <script src="config/app-config.js"></script>

    <script src="config/firebase-config.js"></script>


    <!-- =====================================
         THEME
    ====================================== -->

    <script src="js/core/theme.js?v=580"></script>


    <!-- =====================================
         CORE SERVICES
    ====================================== -->

    <script src="js/core/storage.js"></script>

    <script src="js/core/database.js"></script>


    <!-- =====================================
         PWA INSTALL MANAGER
    ====================================== -->

    <script src="js/core/pwa-install.js"></script>


    <!-- =====================================
         MAIN APPLICATION
    ====================================== -->

    <script src="js/app.js"></script>



    <!-- =====================================
         PWA SERVICE WORKER REGISTRATION
    ====================================== -->

    <script>

        if (
            "serviceWorker" in navigator
        ) {

            window.addEventListener(
                "load",
                function () {

                    navigator
                        .serviceWorker
                        .register(
                            "./service-worker.js"
                        )
                        .then(
                            function (
                                registration
                            ) {

                                console.log(
                                    "Jufelix Service Worker registered:",
                                    registration.scope
                                );

                            }
                        )
                        .catch(
                            function (
                                error
                            ) {

                                console.error(
                                    "Jufelix Service Worker registration failed:",
                                    error
                                );

                            }
                        );

                }
            );

        }

    </script>


</body>

</html>
