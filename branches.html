<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0b5ed7"
    >

    <title>
        Branches | Jufelix ERP v7.0
    </title>


    <!-- =====================================
         STYLES
    ====================================== -->

    <link
        rel="stylesheet"
        href="assets/css/variables.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/base.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/components.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
        }


        .branches-page {
            padding: 24px;
        }


        .page-heading {
            margin-bottom: 24px;
        }


        .page-heading h1 {
            margin: 0 0 6px;
            font-size: 26px;
        }


        .page-heading p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
        }


        /* =====================================
           SUMMARY
        ====================================== */

        .branch-summary-grid {
            display: grid;
            grid-template-columns:
                repeat(
                    4,
                    minmax(0, 1fr)
                );
            gap: 16px;
            margin-bottom: 24px;
        }


        .branch-summary-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 18px;
            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, .05);
        }


        .branch-summary-card span {
            display: block;
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 8px;
        }


        .branch-summary-card strong {
            display: block;
            font-size: 27px;
            color: #111827;
        }


        /* =====================================
           SECTION CARD
        ====================================== */

        .branch-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, .05);
        }


        .branch-card-title {
            margin: 0 0 18px;
            font-size: 19px;
        }


        /* =====================================
           FORM
        ====================================== */

        .branch-form-grid {
            display: grid;
            grid-template-columns:
                repeat(
                    2,
                    minmax(0, 1fr)
                );
            gap: 16px;
        }


        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }


        .form-group.full-width {
            grid-column: 1 / -1;
        }


        .form-group label {
            font-size: 13px;
            font-weight: 700;
            color: #374151;
        }


        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            background: #ffffff;
            color: #111827;
            font-size: 14px;
            outline: none;
        }


        .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }


        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #0b5ed7;
            box-shadow:
                0 0 0 3px
                rgba(11, 94, 215, .12);
        }


        .branch-form-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }


        .primary-button,
        .secondary-button {
            min-height: 44px;
            border: none;
            border-radius: 9px;
            padding: 0 18px;
            font-weight: 700;
            cursor: pointer;
        }


        .primary-button {
            background: #0b5ed7;
            color: #ffffff;
        }


        .primary-button:hover {
            background: #084298;
        }


        .secondary-button {
            background: #e5e7eb;
            color: #1f2937;
        }


        /* =====================================
           FILTERS
        ====================================== */

        .branch-toolbar {
            display: grid;
            grid-template-columns:
                minmax(220px, 1fr)
                minmax(160px, 220px);
            gap: 12px;
            margin-bottom: 18px;
        }


        .branch-toolbar input,
        .branch-toolbar select {
            width: 100%;
            min-height: 42px;
            padding: 9px 12px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            background: #ffffff;
        }


        /* =====================================
           TABLE
        ====================================== */

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }


        .branch-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 980px;
        }


        .branch-table th,
        .branch-table td {
            padding: 13px 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
            vertical-align: middle;
        }


        .branch-table th {
            background: #f8fafc;
            font-size: 12px;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: .4px;
        }


        .branch-table td {
            font-size: 13px;
        }


        .branch-table button {
            border: none;
            border-radius: 7px;
            padding: 7px 10px;
            margin-right: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
        }


        .branch-table button:first-child {
            background: #0b5ed7;
            color: #ffffff;
        }


        .branch-table button:last-child {
            background: #dc3545;
            color: #ffffff;
        }


        .status-active {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 999px;
            background: #dcfce7;
            color: #166534;
            font-weight: 700;
            font-size: 11px;
        }


        .status-inactive {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 999px;
            background: #fee2e2;
            color: #991b1b;
            font-weight: 700;
            font-size: 11px;
        }


        /* =====================================
           RESPONSIVE
        ====================================== */

        @media screen and
        (max-width: 1000px) {

            .branch-summary-grid {
                grid-template-columns:
                    repeat(
                        2,
                        minmax(0, 1fr)
                    );
            }
        }


        @media screen and
        (max-width: 700px) {

            .branches-page {
                padding: 16px;
            }


            .branch-form-grid {
                grid-template-columns: 1fr;
            }


            .form-group.full-width {
                grid-column: auto;
            }


            .branch-toolbar {
                grid-template-columns: 1fr;
            }


            .branch-summary-grid {
                grid-template-columns: 1fr;
            }


            .branch-form-actions {
                flex-direction: column;
            }


            .primary-button,
            .secondary-button {
                width: 100%;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================
         SIDEBAR
    ====================================== -->

    <aside
        id="sidebar"
        class="sidebar"
    ></aside>


    <!-- =====================================
         MAIN CONTENT
    ====================================== -->

    <main class="main-content">


        <!-- =================================
             TOPBAR
        ================================== -->

        <header
            id="topbar"
            class="topbar"
        ></header>


        <section class="branches-page">


            <!-- =================================
                 PAGE HEADER
            ================================== -->

            <div class="page-heading">

                <h1>
                    Branch Management
                </h1>

                <p>
                    Create and manage Head Office,
                    warehouses and business branches.
                </p>

            </div>


            <!-- =================================
                 SUMMARY
            ================================== -->

            <div class="branch-summary-grid">


                <div class="branch-summary-card">

                    <span>
                        Total Branches
                    </span>

                    <strong
                        id="totalBranches"
                    >
                        0
                    </strong>

                </div>


                <div class="branch-summary-card">

                    <span>
                        Active Branches
                    </span>

                    <strong
                        id="activeBranches"
                    >
                        0
                    </strong>

                </div>


                <div class="branch-summary-card">

                    <span>
                        Head Office
                    </span>

                    <strong
                        id="headOfficeCount"
                    >
                        0
                    </strong>

                </div>


                <div class="branch-summary-card">

                    <span>
                        Inactive Branches
                    </span>

                    <strong
                        id="inactiveBranches"
                    >
                        0
                    </strong>

                </div>


            </div>


            <!-- =================================
                 BRANCH FORM
            ================================== -->

            <div class="branch-card">


                <h2
                    id="branchFormTitle"
                    class="branch-card-title"
                >
                    Add New Branch
                </h2>


                <form
                    id="branchForm"
                    autocomplete="off"
                >


                    <input
                        type="hidden"
                        id="branchId"
                    >


                    <div class="branch-form-grid">


                        <!-- Branch Name -->

                        <div class="form-group">

                            <label
                                for="branchName"
                            >
                                Branch Name *
                            </label>

                            <input
                                type="text"
                                id="branchName"
                                placeholder="Example: Agona Swedru"
                                required
                            >

                        </div>


                        <!-- Branch Code -->

                        <div class="form-group">

                            <label
                                for="branchCode"
                            >
                                Branch Code *
                            </label>

                            <input
                                type="text"
                                id="branchCode"
                                placeholder="Example: ASW"
                                maxlength="15"
                                required
                            >

                        </div>


                        <!-- Branch Type -->

                        <div class="form-group">

                            <label
                                for="branchType"
                            >
                                Branch Type
                            </label>

                            <select
                                id="branchType"
                            >

                                <option value="branch">
                                    Regular Branch
                                </option>

                                <option value="warehouse">
                                    Warehouse
                                </option>

                                <option value="head-office">
                                    Head Office
                                </option>

                            </select>

                        </div>


                        <!-- Status -->

                        <div class="form-group">

                            <label
                                for="branchStatus"
                            >
                                Status
                            </label>

                            <select
                                id="branchStatus"
                            >

                                <option value="active">
                                    Active
                                </option>

                                <option value="inactive">
                                    Inactive
                                </option>

                            </select>

                        </div>


                        <!-- Manager -->

                        <div class="form-group">

                            <label
                                for="branchManager"
                            >
                                Branch Manager
                            </label>

                            <input
                                type="text"
                                id="branchManager"
                                placeholder="Manager name"
                            >

                        </div>


                        <!-- Phone -->

                        <div class="form-group">

                            <label
                                for="branchPhone"
                            >
                                Phone Number *
                            </label>

                            <input
                                type="tel"
                                id="branchPhone"
                                placeholder="0240000000"
                                required
                            >

                        </div>


                        <!-- Email -->

                        <div class="form-group">

                            <label
                                for="branchEmail"
                            >
                                Email
                            </label>

                            <input
                                type="email"
                                id="branchEmail"
                                placeholder="branch@example.com"
                            >

                        </div>


                        <!-- Opening Date -->

                        <div class="form-group">

                            <label
                                for="branchOpeningDate"
                            >
                                Opening Date
                            </label>

                            <input
                                type="date"
                                id="branchOpeningDate"
                            >

                        </div>


                        <!-- Address -->

                        <div
                            class="
                                form-group
                                full-width
                            "
                        >

                            <label
                                for="branchAddress"
                            >
                                Branch Address *
                            </label>

                            <textarea
                                id="branchAddress"
                                placeholder="Enter branch location or address"
                                required
                            ></textarea>

                        </div>


                        <!-- Notes -->

                        <div
                            class="
                                form-group
                                full-width
                            "
                        >

                            <label
                                for="branchNotes"
                            >
                                Notes
                            </label>

                            <textarea
                                id="branchNotes"
                                placeholder="Optional branch notes"
                            ></textarea>

                        </div>


                    </div>


                    <div class="branch-form-actions">


                        <button
                            type="submit"
                            id="saveBranchButton"
                            class="primary-button"
                        >
                            Save Branch
                        </button>


                        <button
                            type="button"
                            id="clearBranchButton"
                            class="secondary-button"
                        >
                            Clear Form
                        </button>


                    </div>


                </form>


            </div>


            <!-- =================================
                 BRANCH LIST
            ================================== -->

            <div class="branch-card">


                <h2 class="branch-card-title">
                    Branch List
                </h2>


                <div class="branch-toolbar">


                    <input
                        type="search"
                        id="branchSearch"
                        placeholder="Search branch, code, manager, phone..."
                    >


                    <select
                        id="branchStatusFilter"
                    >

                        <option value="">
                            All Statuses
                        </option>

                        <option value="active">
                            Active
                        </option>

                        <option value="inactive">
                            Inactive
                        </option>

                    </select>


                </div>


                <div class="table-wrapper">


                    <table class="branch-table">


                        <thead>

                            <tr>

                                <th>
                                    Branch
                                </th>

                                <th>
                                    Code
                                </th>

                                <th>
                                    Type
                                </th>

                                <th>
                                    Manager
                                </th>

                                <th>
                                    Phone
                                </th>

                                <th>
                                    Address
                                </th>

                                <th>
                                    Status
                                </th>

                                <th>
                                    Actions
                                </th>

                            </tr>

                        </thead>


                        <tbody
                            id="branchTableBody"
                        >

                            <tr>

                                <td
                                    colspan="8"
                                    style="
                                        text-align:center;
                                        padding:30px;
                                        color:#888;
                                    "
                                >
                                    Loading branches...
                                </td>

                            </tr>

                        </tbody>


                    </table>


                </div>


            </div>


        </section>


    </main>


    <!-- =====================================
         FIREBASE CONFIGURATION
    ====================================== -->

    <script
        src="config/firebase-config.js?v=701"
    ></script>


    <!-- =====================================
         FIREBASE CONNECTION
    ====================================== -->

    <script
        type="module"
        src="js/core/firebase.js?v=703"
    ></script>


    <!-- =====================================
         CORE CONFIG
    ====================================== -->

    <script
        src="js/core/config.js?v=580"
    ></script>


    <!-- =====================================
         CORE STORAGE
    ====================================== -->

    <script
        src="js/core/storage.js?v=580"
    ></script>


    <!-- =====================================
         CORE DATABASE
    ====================================== -->

    <script
        src="js/core/database.js?v=580"
    ></script>


    <!-- =====================================
         PERMISSIONS
    ====================================== -->

    <script
        src="js/core/permissions.js?v=550"
    ></script>


    <!-- =====================================
         AUTH GUARD
    ====================================== -->

    <script
        src="js/core/auth-guard.js?v=650"
    ></script>


    <!-- =====================================
         THEME
    ====================================== -->

    <script
        src="js/core/theme.js?v=580"
    ></script>


    <!-- =====================================
         COMPONENTS
    ====================================== -->

    <script
        src="js/components/sidebar.js?v=610"
    ></script>

    <script
        src="js/components/topbar.js?v=621"
    ></script>


    <!-- =====================================
         BRANCHES CLOUD

         Two-way multi-device sync
    ====================================== -->

    <script
        src="js/cloud/branches-cloud.js?v=801"
    ></script>


    <!-- =====================================
         BRANCHES MODULE
    ====================================== -->

    <script
        src="js/modules/branches.js?v=200"
    ></script>


</body>

</html>
